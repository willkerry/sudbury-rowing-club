packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  core-js: false
  esbuild: false
  lefthook: false
  sharp: false
  workerd: false

catalog:
  "@portabletext/types": "^4.0.2"
  "@sanity/image-url": "^2.1.1"
  "@types/he": "^1.2.3"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  emoji-regex: "^11.0.0"
  groq: "^6.18.0"
  he: "^2.0.0"
  isomorphic-dompurify: "^4.5.0"
  radashi: "^12.9.6"
  react: "19.3.0"
  react-dom: "19.3.0"
  tsdown: "^0.23.0"
  typescript: "^7.0.2"
  vitest: "^5.0.3"
  wrangler: "^4.149.0"
  zod: "^4.6.5"

overrides:
  "@swc/core": "^1.13.5"
  "@swc/core-darwin-arm64": "^1.13.5"
  "@types/react": "catalog:"
  "@types/react-dom": "catalog:"
  parse5: "^7.1.2"
  # jsdom >=27 depends on the ESM-only @exodus/bytes, which breaks under
  # Next's CJS `serverExternalPackages` require() with ERR_REQUIRE_ESM.
  # Pin to the last line that still uses the CJS whatwg-encoding sniffer.
  jsdom: "^26.1.0"
