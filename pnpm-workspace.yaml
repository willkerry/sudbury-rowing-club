packages:
  - "packages/*"
  - "apps/*"
registry: https://registry.vlt.io/upstream/npm/
catalogMode: prefer
allowBuilds:
  core-js: false
  esbuild: false
  lefthook: false
  sharp: false
  workerd: false

catalog:
  "@cloudflare/workers-types": "^5.20261118.1"
  "@portabletext/types": "^4.0.2"
  "@sanity/image-url": "^2.2.0"
  '@sanity/preview-url-secret': ^4.1.5
  '@sanity/visual-editing': ^6.2.1
  "@testing-library/react": "^16.3.3"
  "@types/he": "^1.2.3"
  "@types/node": "^26.6.6"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@vitejs/plugin-react": "^6.3.0"
  drizzle-orm: "^0.45.4"
  emoji-regex: "^11.0.0"
  groq: "^6.24.0"
  he: "^2.0.0"
  inter-ui: "^4.1.1"
  jsdom: "^31.0.1"
  radashi: "^13.1.0"
  react: "19.3.1"
  react-dom: "19.3.1"
  tsdown: "^0.23.7"
  typescript: "^7.0.2"
  vitest: "^5.1.1"
  wrangler: "^4.165.0"
  zod: "^4.6.7"

overrides:
  "@swc/core": "^1.13.5"
  "@swc/core-darwin-arm64": "^1.13.5"
  "@types/react": "catalog:"
  "@types/react-dom": "catalog:"
  # Only imports next/image types; its next <=15 peer range pulls in next 15 and its vulnerable postcss.
  next-sanity-image>next: ^16.4.6

patchedDependencies:
  vinext@1.4.6: patches/vinext@1.4.6.patch
