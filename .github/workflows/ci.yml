name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_PUBLIC_ALGOLIA_APP_ID: ${{ secrets.NEXT_PUBLIC_ALGOLIA_APP_ID }}
  NEXT_PUBLIC_ALGOLIA_INDEX_NAME: ${{ secrets.NEXT_PUBLIC_ALGOLIA_INDEX_NAME }}
  NEXT_PUBLIC_ALGOLIA_SEARCH_KEY: ${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY }}
  NEXT_PUBLIC_APP_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
  NEXT_PUBLIC_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}
  NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
  NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
  NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
  NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  # Builds the web app once and either uploads a preview version (pull
  # requests) or migrates D1 and deploys to production (pushes).
  web:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@sudburyrc/web...

      - name: Upload preview version
        if: github.event_name == 'pull_request'
        id: preview
        working-directory: apps/web
        run: |
          pnpm exec wrangler versions upload \
            -c dist/server/wrangler.json \
            --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} @ ${NEXT_PUBLIC_GIT_COMMIT_SHA::7}" \
            | tee upload.log
          echo "url=$(grep -oE 'https://pr-[^ ]+\.workers\.dev' upload.log | head -1)" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: web-preview
          message: |
            Preview: ${{ steps.preview.outputs.url }}

            Previews share production's KV, D1 and email bindings, so the contact form sends real email.

      - name: Apply D1 migrations
        if: github.event_name == 'push'
        working-directory: apps/web
        run: pnpm run db:migrate

      - name: Deploy
        if: github.event_name == 'push'
        working-directory: apps/web
        run: pnpm exec wrangler deploy -c dist/server/wrangler.json --message "${GITHUB_SHA::7}"
