name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  # Dependabot and fork PRs get no secrets; pushes never use placeholders.
  NEXT_PUBLIC_ALGOLIA_APP_ID:
    ${{ secrets.NEXT_PUBLIC_ALGOLIA_APP_ID || (github.event_name ==
    'pull_request' && 'ci-placeholder' || '') }}
  NEXT_PUBLIC_ALGOLIA_INDEX_NAME:
    ${{ secrets.NEXT_PUBLIC_ALGOLIA_INDEX_NAME || (github.event_name ==
    'pull_request' && 'ci-placeholder' || '') }}
  NEXT_PUBLIC_ALGOLIA_SEARCH_KEY:
    ${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY || (github.event_name ==
    'pull_request' && 'ci-placeholder' || '') }}
  NEXT_PUBLIC_APP_ENV:
    ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
  NEXT_PUBLIC_MAPTILER_KEY:
    ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY || (github.event_name ==
    'pull_request' && 'ci-placeholder' || '') }}
  NEXT_PUBLIC_POSTHOG_HOST:
    ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST || (github.event_name ==
    'pull_request' && 'https://eu.i.posthog.com' || '') }}
  NEXT_PUBLIC_POSTHOG_KEY:
    ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY || (github.event_name ==
    'pull_request' && 'ci-placeholder' || '') }}
  NEXT_PUBLIC_SANITY_DATASET:
    ${{ secrets.NEXT_PUBLIC_SANITY_DATASET || (github.event_name ==
    'pull_request' && 'ci-placeholder' || '') }}
  NEXT_PUBLIC_SANITY_PROJECT_ID:
    ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID || (github.event_name ==
    'pull_request' && 'ci-placeholder' || '') }}
  NEXT_PUBLIC_TURNSTILE_SITE_KEY:
    ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY || (github.event_name ==
    'pull_request' && 'ci-placeholder' || '') }}

jobs:
  verify:
    name: Lint, build, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      base: ${{ steps.changes.outputs.base }}
      web: ${{ steps.changes.outputs.web }}
    steps:
      # Full history, without blobs, so turbo can diff against the last good deploy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          submodules: recursive

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      # Keyed by Node version, which turbo's hashes ignore.
      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-

      - run: pnpm install --frozen-lockfile

      # Stops each package's Vitest writing its own summary.
      - name: Build, type-check and test
        run:
          env -u GITHUB_STEP_SUMMARY pnpm turbo run build type-check test
          --continue --summarize

      - name: Oxlint
        if: ${{ !cancelled() }}
        run: pnpm exec oxlint --format=json > "$RUNNER_TEMP/oxlint.json"

      # After the build: Tailwind class sorting reads blue's built CSS.
      - name: Oxfmt
        if: ${{ !cancelled() }}
        run: pnpm exec oxfmt --list-different > "$RUNNER_TEMP/oxfmt.txt"

      - name: actionlint
        if: ${{ !cancelled() }}
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          # shellcheck disable=SC2016 # a Go template, not shell
          "$RUNNER_TEMP/actionlint" -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}},title=actionlint ({{$err.Kind}})::{{$err.Message}}\n{{end}}'

      - name: zizmor
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true

      - name: Type-check CI scripts
        if: ${{ !cancelled() }}
        run: pnpm exec tsc -p scripts/ci

      - name: Build report
        if: ${{ !cancelled() }}
        run: node scripts/ci/turbo-report.ts "Build, type-check and test"

      - name: Lint report
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci/lint-report.ts \
            "$RUNNER_TEMP/oxlint.json" "$RUNNER_TEMP/oxfmt.txt"

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          if-no-files-found: ignore
          retention-days: 14

      # Diffs against the last fully green master run, so the next push retries a
      # failed deploy. With no base (a manual run, or none found), everything deploys.
      - name: Find changes since the last good deploy
        id: changes
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=""
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            base=$(gh run list --workflow ci.yml --branch master --event push \
              --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
            git cat-file -e "$base^{commit}" 2>/dev/null || base=""
          fi

          web=true
          if [ -n "$base" ]; then
            web=$(TURBO_SCM_BASE="$base" node_modules/.bin/turbo ls --affected \
              --filter=@sudburyrc/web --output=json | jq '.packages.count > 0')
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

      # Keeps only this run's outputs, so the saved cache doesn't grow run on run.
      - name: Prune turbo cache
        if: ${{ !cancelled() && hashFiles('.turbo/runs/*.json') != '' }}
        run: |
          jq -r '.tasks[].hash' .turbo/runs/*.json | sort -u > "$RUNNER_TEMP/hashes.txt"
          for file in .turbo/cache/*; do
            name=$(basename "$file")
            grep -qxF "${name%%[-.]*}" "$RUNNER_TEMP/hashes.txt" || rm "$file"
          done

  web:
    name: Deploy web
    # Previews for same-repo PRs (Dependabot and forks get no token); production
    # from master when web changed since the last good deploy.
    needs: verify
    if: >-
      ${{ (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]') || (github.ref == 'refs/heads/master' &&
      needs.verify.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deployed.outputs.url }}
    concurrency:
      group:
        deploy-${{ github.event_name == 'pull_request' &&
        github.event.pull_request.number || 'production' }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MODE: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SITE_URL: https://sudburyrowingclub.org.uk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@sudburyrc/web...

      # After the build, so turbo can reuse web's build across commits.
      - name: Stamp commit SHA
        working-directory: apps/web
        run: |
          jq --arg sha "$SHA" '.vars.GIT_COMMIT_SHA = $sha | .previews.vars.GIT_COMMIT_SHA = $sha' \
            dist/server/wrangler.json > "$RUNNER_TEMP/wrangler.json"
          mv "$RUNNER_TEMP/wrangler.json" dist/server/wrangler.json

      - name: Prepare
        run: |
          mkdir -p "$RUNNER_TEMP/wrangler"
          {
            echo "WRANGLER_OUTPUT_FILE_DIRECTORY=$RUNNER_TEMP/wrangler"
            echo "WRANGLER_SEND_METRICS=false"
          } >> "$GITHUB_ENV"

      - name: Check D1 migrations
        id: migrations
        continue-on-error: true
        working-directory: apps/web
        run: |
          applied=$(pnpm exec wrangler d1 execute sudbury-web --remote --json \
            --command "SELECT name FROM d1_migrations" | jq -r '.[0].results[].name')
          for file in ../../packages/db/migrations/*.sql; do
            name=$(basename "$file")
            grep -qxF "$name" <<<"$applied" || echo "$name"
          done > "$RUNNER_TEMP/migrations.txt"
          cat "$RUNNER_TEMP/migrations.txt"

      # `wrangler preview` doesn't report the bundle size.
      - name: Measure Worker size
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        run: |
          NO_COLOR=1 pnpm exec wrangler versions upload --dry-run \
            -c dist/server/wrangler.json --outdir "$RUNNER_TEMP/dry-run" \
            | grep "Total Upload" | tee "$RUNNER_TEMP/size.log"

      # Version preview URLs aren't generated for Workers with Durable Objects.
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        run: |
          pnpm exec wrangler preview \
            -c dist/server/wrangler.json \
            --name "pr-$PR_NUMBER" \
            --message "PR #$PR_NUMBER @ ${SHA::7}" \
            --tag "${SHA::7}"

      - name: Apply D1 migrations
        if: github.event_name != 'pull_request'
        working-directory: apps/web
        run: pnpm run db:migrate

      - name: Deploy
        if: github.event_name != 'pull_request'
        working-directory: apps/web
        run:
          pnpm exec vinext-cloudflare deploy --skip-build --config
          dist/server/wrangler.json

      - name: Read deploy output
        id: deployed
        if: ${{ !cancelled() }}
        env:
          SIZE_LOG: ${{ runner.temp }}/size.log
        run: node scripts/ci/web-report.ts outputs "$RUNNER_TEMP/web-bundle-stats.json"

      - name: Smoke test
        if: steps.deployed.outputs.smoke_url != ''
        env:
          URL: ${{ steps.deployed.outputs.smoke_url }}
        run: node scripts/ci/smoke.ts "$URL" "$RUNNER_TEMP/smoke.md"

      # Master pushes that don't touch web skip its deploy, so take the newest artifact.
      - name: Download master's bundle size
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=web-bundle-stats&per_page=30" \
            --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "master")][0].workflow_run.id // empty')
          if [ -z "$run_id" ] || ! gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" --name web-bundle-stats \
            --dir "$RUNNER_TEMP/base"; then
            echo "No bundle size from master yet, so no comparison this time"
          fi

      - name: Report
        if: ${{ !cancelled() }}
        env:
          BASE_STATS_FILE: ${{ runner.temp }}/base/web-bundle-stats.json
          JOB_STATUS: ${{ job.status }}
          MIGRATIONS_FILE:
            ${{ steps.migrations.outcome == 'success' &&
            format('{0}/migrations.txt', runner.temp) || '' }}
          SMOKE_FILE: ${{ runner.temp }}/smoke.md
          STATS_FILE: ${{ runner.temp }}/web-bundle-stats.json
          URL: ${{ steps.deployed.outputs.url }}
          VERSION_ID: ${{ steps.deployed.outputs.version_id }}
          VERSION_URL: ${{ steps.deployed.outputs.preview_url }}
        run: node scripts/ci/web-report.ts report "$RUNNER_TEMP/web-report.md"

      - name: Comment on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: web-preview
          path: ${{ runner.temp }}/web-report.md

      - name: Upload bundle size
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-bundle-stats
          path: ${{ runner.temp }}/web-bundle-stats.json
          if-no-files-found: ignore
          retention-days: 90

      # Skipped until POSTHOG_PERSONAL_API_KEY and POSTHOG_PROJECT_ID exist.
      - name: Annotate deploy in PostHog
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
        run: |
          if [ -z "$POSTHOG_KEY" ] || [ -z "$POSTHOG_PROJECT_ID" ]; then
            echo "PostHog not configured, skipping"
            exit 0
          fi
          api_host=${NEXT_PUBLIC_POSTHOG_HOST/.i.posthog.com/.posthog.com}
          body=$(jq -n \
            --arg content "Deployed ${SHA::7}: ${COMMIT_MESSAGE%%$'\n'*}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{content: $content, date_marker: $date, scope: "project"}')
          curl -fsS -X POST "$api_host/api/projects/$POSTHOG_PROJECT_ID/annotations/" \
            -H "Authorization: Bearer $POSTHOG_KEY" \
            -H "Content-Type: application/json" \
            -d "$body" > /dev/null

  apps:
    name: Deploy og, cms and results
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: deploy-apps
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
      TURBO_SCM_BASE: ${{ needs.verify.outputs.base }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          submodules: recursive

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-

      - run: pnpm install --frozen-lockfile

      # Runs each changed app's own `deploy` script; web deploys in its own job.
      - name: Deploy changed apps
        run: |
          if [ -n "$TURBO_SCM_BASE" ]; then
            pnpm turbo run deploy --filter='!@sudburyrc/web' --affected
          else
            pnpm turbo run deploy --filter='!@sudburyrc/web'
          fi

      - name: Smoke test
        run: |
          curl -fsSL -o /dev/null https://edit.sudburyrowingclub.org.uk
          curl -fsSL -o /dev/null https://results.sudburyrowingclub.org.uk
